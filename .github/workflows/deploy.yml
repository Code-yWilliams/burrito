name: plan-and-deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# Never run two pipelines against the cluster/state at once.
concurrency:
  group: production
  cancel-in-progress: false

env:
  # OCI tenancy Object Storage namespace, also used as the OCIR registry
  # namespace segment. Immutable for the life of the tenancy; set once as a
  # repo variable (Settings > Secrets and variables > Actions > Variables)
  # rather than duplicated as a literal across this file and values.yaml.
  OCI_REGISTRY: sjc.ocir.io/${{ vars.OCI_NAMESPACE }}
  # Not secret (same value as the terraform/variables.tf default); wrangler
  # needs it to target the right account for Pages deploys.
  CLOUDFLARE_ACCOUNT_ID: a2307e3c074e5ba8067e3220eeaf53c0
  TF_IN_AUTOMATION: "true"
  # OCI's S3-compatible API rejects the AWS SDK's default integrity checksums
  # ("AWS chunked encoding not supported"); only send them when required.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  # Typechecks and builds both packages on every PR push. Needs no secrets,
  # so it also runs on forked PRs (unlike plan). Catches TS/build breakage
  # before merge — the Docker image build only happens post-merge.
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build API
        run: npm ci && npm run build
        working-directory: app

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

  # Runs for every PR push (opened/synchronize/reopened) and for direct
  # pushes to main, but NOT for the PR "closed" event. Produces the
  # terraform diff in the job summary and uploads the plan file, keyed to
  # the commit it was computed from, so deploy can apply exactly what was
  # reviewed here instead of re-planning after merge.
  plan:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AWS_ACCESS_KEY_ID: op://Burrito/burrito-ci/AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY: op://Burrito/burrito-ci/AWS_SECRET_ACCESS_KEY
          TF_VAR_tenancy_ocid: op://Burrito/burrito-ci/TF_VAR_tenancy_ocid
          TF_VAR_user_ocid: op://Burrito/burrito-ci/TF_VAR_user_ocid
          TF_VAR_fingerprint: op://Burrito/burrito-ci/TF_VAR_fingerprint
          TF_VAR_oci_private_key: op://Burrito/burrito-ci/TF_VAR_oci_private_key
          TF_VAR_ssh_public_key: op://Burrito/burrito-ci/TF_VAR_ssh_public_key
          TF_VAR_my_ip_cidr: op://Burrito/burrito-ci/TF_VAR_my_ip_cidr
          TF_VAR_cloudflare_api_token: op://Burrito/burrito-ci/TF_VAR_cloudflare_api_token

      # Fail the PR (not a mid-apply 403 after merge) when the hand-managed
      # Cloudflare token is missing a permission the config needs. The
      # script is the canonical list of required scopes.
      - name: Verify Cloudflare token scopes
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.TF_VAR_cloudflare_api_token }}
        run: scripts/check-cloudflare-token.sh "$CLOUDFLARE_ACCOUNT_ID"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      - run: terraform init -input=false

      - run: terraform validate

      - run: terraform plan -input=false -out=tfplan

      - name: Add plan diff to job summary
        run: |
          echo '## Terraform plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.pull_request.head.sha || github.sha }}
          path: terraform/tfplan
          retention-days: 5

  # Classifies the merged PR's changed files so the jobs below build and
  # deploy only the packages that actually changed. Docs-only merges skip
  # the deploy job — and its production-approval pause — entirely.
  changes:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.classify.outputs.api }}
      web: ${{ steps.classify.outputs.web }}
      infra: ${{ steps.classify.outputs.infra }}
    steps:
      - name: Classify the PR's changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api=false; web=false; infra=false
          while IFS= read -r f; do
            case "$f" in
              # helm/ counts as an API change (not just infra) so the image
              # is rebuilt too — keeping the invariant that whenever helm
              # deploys, an image tagged with this merge SHA exists.
              app/*|helm/*) api=true ;;
              web/*) web=true ;;
              terraform/*|scripts/*) infra=true ;;
              # Pipeline changes could affect any of the paths: deploy all.
              .github/*) api=true; web=true; infra=true ;;
            esac
          done < <(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "api=$api"     >> "$GITHUB_OUTPUT"
          echo "web=$web"     >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "api=$api web=$web infra=$infra"

  # Builds the app image on a native arm64 runner (free for public repos)
  # and pushes it to OCIR tagged with the commit SHA. Only runs once a PR
  # is actually merged — never for a plain push to main — and only when
  # the PR touched the API (app/ or helm/).
  build:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      # Build from the actual commit that landed on main, not the
      # ephemeral pull_request merge-preview ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OCIR_USERNAME: op://Burrito/burrito-ci/OCIR_USERNAME
          OCIR_TOKEN: op://Burrito/burrito-ci/OCIR_TOKEN

      - uses: docker/login-action@v3
        with:
          registry: sjc.ocir.io
          username: ${{ env.OCIR_USERNAME }}
          password: ${{ env.OCIR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCI_REGISTRY }}/burrito/app:${{ github.event.pull_request.merge_commit_sha }}
            ${{ env.OCI_REGISTRY }}/burrito/app:latest

  # Gated by the "production" environment: the run pauses here until approved
  # in the GitHub UI. Applies the exact plan file produced during the PR's
  # own plan run — never a freshly regenerated one — so what gets applied
  # is provably what was reviewed pre-merge. Branch protection requires the
  # "plan" check to pass before a PR can merge, which guarantees that
  # artifact exists by the time this job looks for it.
  #
  # Everything builds before anything deploys (a broken frontend build can
  # no longer strand a half-shipped release: the image was built in the
  # build job, and web/dist is built below before either deploy step).
  # Deploy order defaults to API first, then frontend — the old frontend
  # must keep working against the new API anyway. Label the PR
  # `web-first` before merging to flip the order (e.g. when the new
  # frontend must land before an API change breaks the old one).
  deploy:
    # !cancelled() so this still runs when build was skipped (web- or
    # infra-only PRs); build's result is checked explicitly instead.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true')
    needs: [changes, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AWS_ACCESS_KEY_ID: op://Burrito/burrito-ci/AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY: op://Burrito/burrito-ci/AWS_SECRET_ACCESS_KEY
          TF_VAR_tenancy_ocid: op://Burrito/burrito-ci/TF_VAR_tenancy_ocid
          TF_VAR_user_ocid: op://Burrito/burrito-ci/TF_VAR_user_ocid
          TF_VAR_fingerprint: op://Burrito/burrito-ci/TF_VAR_fingerprint
          TF_VAR_oci_private_key: op://Burrito/burrito-ci/TF_VAR_oci_private_key
          TF_VAR_ssh_public_key: op://Burrito/burrito-ci/TF_VAR_ssh_public_key
          TF_VAR_my_ip_cidr: op://Burrito/burrito-ci/TF_VAR_my_ip_cidr
          TF_VAR_cloudflare_api_token: op://Burrito/burrito-ci/TF_VAR_cloudflare_api_token
          OCIR_USERNAME: op://Burrito/burrito-ci/OCIR_USERNAME
          OCIR_TOKEN: op://Burrito/burrito-ci/OCIR_TOKEN
          POSTGRES_PASSWORD: op://Burrito/burrito-ci/POSTGRES_PASSWORD
          CI_SSH_PRIVATE_KEY: op://Burrito/burrito-ci/CI_SSH_PRIVATE_KEY
          # cloudflared reads these env var names natively, so the SSH
          # ProxyCommand below needs no credential flags.
          TUNNEL_SERVICE_TOKEN_ID: op://Burrito/burrito-ci/CF_ACCESS_CLIENT_ID
          TUNNEL_SERVICE_TOKEN_SECRET: op://Burrito/burrito-ci/CF_ACCESS_CLIENT_SECRET

      # Re-checked here (not just at plan time) because the token can be
      # edited between merge and approval; a missing scope at apply time
      # 403s halfway through and leaves the reviewed plan stale (the
      # August 2026 Pages rollout failed exactly this way).
      - name: Verify Cloudflare token scopes
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.TF_VAR_cloudflare_api_token }}
        run: scripts/check-cloudflare-token.sh "$CLOUDFLARE_ACCOUNT_ID"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
        working-directory: terraform

      - name: Locate the PR's plan run
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: tfplan-${{ github.event.pull_request.head.sha }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::No plan artifact found for PR head ${{ github.event.pull_request.head.sha }} (name $ARTIFACT_NAME)." \
              "It may have expired (5-day retention) or the plan job never completed for this commit." \
              "Push a new commit to the branch (or reopen the PR) so a fresh plan runs, then merge again."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the exact plan reviewed in the PR
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.pull_request.head.sha }}
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: terraform

      - name: Terraform apply (exact plan reviewed in the PR)
        run: terraform apply -input=false tfplan
        working-directory: terraform

      # ---- Build phase: everything compiles before anything deploys. ----

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 22

      - name: Build frontend
        if: needs.changes.outputs.web == 'true'
        run: npm ci && npm run build
        working-directory: web

      # ---- Deploy phase. ----

      - name: Deploy frontend first (PR labeled web-first)
        if: >-
          needs.changes.outputs.web == 'true' &&
          contains(github.event.pull_request.labels.*.name, 'web-first')
        uses: ./.github/actions/deploy-web
        with:
          cloudflare-api-token: ${{ env.TF_VAR_cloudflare_api_token }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Open tunnel kubectl access
        if: needs.changes.outputs.api == 'true'
        uses: ./.github/actions/tunnel-kubectl
        with:
          ci-ssh-private-key: ${{ env.CI_SSH_PRIVATE_KEY }}

      - name: Ensure namespace and OCIR pull secret
        if: needs.changes.outputs.api == 'true'
        run: |
          kubectl create namespace burrito --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n burrito create secret docker-registry ocir-pull \
            --docker-server=sjc.ocir.io \
            --docker-username="$OCIR_USERNAME" \
            --docker-password="$OCIR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # --atomic: if the rollout itself fails (pods never go ready), helm
      # rolls straight back to the previous revision instead of leaving a
      # broken release. Failures *after* helm returns (e.g. the healthz
      # verify below) are what the manual rollback workflow is for.
      - name: Helm deploy
        if: needs.changes.outputs.api == 'true'
        run: |
          helm upgrade --install burrito ./helm/burrito \
            --namespace burrito \
            --set image.repository="${{ env.OCI_REGISTRY }}/burrito/app" \
            --set image.tag="${{ github.event.pull_request.merge_commit_sha }}" \
            --set postgres.password="$POSTGRES_PASSWORD" \
            --atomic --wait --timeout 5m

      # Hits the public HTTPS hostname, so this exercises the whole path:
      # DNS -> Cloudflare edge TLS -> tunnel -> Traefik -> app -> Postgres.
      # Retried because the pod rollover can serve a brief 503 right after
      # helm --wait returns (readiness gates the pod, not the app→DB path).
      - name: Verify /healthz over HTTPS
        if: needs.changes.outputs.api == 'true'
        run: |
          for i in $(seq 1 24); do
            if curl -sf "https://api-burrito.moldysandwich.com/healthz"; then
              exit 0
            fi
            echo "healthz not ready yet (attempt $i), retrying in 5s..."
            sleep 5
          done
          echo "::error::/healthz did not return 200 within 2m"
          exit 1

      - name: Deploy frontend (default order — after the API)
        if: >-
          needs.changes.outputs.web == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'web-first')
        uses: ./.github/actions/deploy-web
        with:
          cloudflare-api-token: ${{ env.TF_VAR_cloudflare_api_token }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
